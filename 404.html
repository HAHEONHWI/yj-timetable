<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - 용정 시간표</title>
    <link rel="icon" href="/assets/logo.png" />
    <style>
      :root {
        --bg: #070b12;
        --surface: #111827;
        --surface-soft: #151f31;
        --line: #2f3b4c;
        --ink: #f1f5f9;
        --muted: #9aa8bd;
        --teal: #0f766e;
        --teal-light: #5eead4;
        --blue: #3b82f6;
        --amber: #fbbf24;
        font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(145deg, #08111d 0%, var(--bg) 55%, #081512 100%);
        background-size: 58px 58px, 58px 58px, auto;
        color: var(--ink);
      }

      a {
        color: inherit;
      }

      .page {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        min-height: 86px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 16px clamp(20px, 5vw, 72px);
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(7, 11, 18, 0.88);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        text-decoration: none;
      }

      .brand img {
        width: 50px;
        height: 50px;
        object-fit: contain;
      }

      .brand p {
        margin: 0;
        color: var(--teal-light);
        font-size: 13px;
        font-weight: 900;
      }

      .brand h1 {
        margin: 2px 0 0;
        font-size: 23px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .nav a,
      .button {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(17, 24, 39, 0.86);
        padding: 0 14px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 900;
      }

      .nav a:hover,
      .button:hover,
      .quick-link:hover {
        border-color: rgba(94, 234, 212, 0.7);
        background: rgba(15, 118, 110, 0.18);
      }

      main {
        display: grid;
        place-items: center;
        padding: clamp(28px, 5vw, 72px) 20px;
      }

      .content {
        width: min(980px, 100%);
        display: grid;
        gap: 18px;
      }

      .hero {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: clamp(24px, 4vw, 46px);
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 12px;
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.2), transparent 42%),
          rgba(17, 24, 39, 0.94);
        padding: clamp(30px, 5vw, 54px);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
      }

      .code-box {
        min-width: 210px;
        text-align: center;
      }

      .code {
        margin: 0;
        font-size: clamp(72px, 8vw, 112px);
        line-height: 0.92;
        font-weight: 950;
        letter-spacing: 0;
      }

      .status {
        width: fit-content;
        margin: 14px auto 0;
        border: 1px solid rgba(251, 191, 36, 0.5);
        border-radius: 999px;
        background: rgba(251, 191, 36, 0.1);
        color: var(--amber);
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 900;
      }

      .copy {
        min-width: 0;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--teal-light);
        font-size: 13px;
        font-weight: 900;
      }

      h2 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(30px, 3.4vw, 44px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      .description {
        max-width: 650px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.65;
        font-weight: 750;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .button.primary {
        border-color: var(--teal);
        background: var(--teal);
        color: #ecfeff;
      }

      .button.secondary {
        border-color: rgba(59, 130, 246, 0.58);
      }

      .quick-links {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .quick-link {
        display: grid;
        gap: 5px;
        min-height: 92px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(17, 24, 39, 0.82);
        padding: 14px;
        text-decoration: none;
      }

      .quick-link strong {
        font-size: 15px;
      }

      .quick-link span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.4;
      }

      .footer-note {
        color: #718096;
        font-size: 12px;
        font-weight: 800;
        text-align: center;
      }

      @media (max-width: 860px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .nav {
          width: 100%;
          justify-content: stretch;
        }

        .nav a {
          flex: 1 1 42%;
        }

        .hero {
          grid-template-columns: 1fr;
        }

        .code-box {
          min-width: 0;
          text-align: left;
        }

        .status {
          margin-left: 0;
          margin-right: 0;
        }

        .quick-links {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .quick-links {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="용정 시간표 홈으로 이동">
          <img src="/assets/logo.png" alt="" />
          <div>
            <p>용정 전용 시간표</p>
            <h1>용정 시간표</h1>
          </div>
        </a>

        <nav class="nav" aria-label="주요 페이지">
          <a href="/">조회</a>
          <a href="/slide">슬라이드쇼</a>
          <a href="/download">다운로드</a>
          <a href="/admin">관리자</a>
        </nav>
      </header>

      <main>
        <section class="content" aria-labelledby="title">
          <article class="hero">
            <div class="code-box">
              <div class="code">404</div>
              <div class="status">잘못된 주소</div>
            </div>

            <div class="copy">
              <p class="eyebrow">Page Not Found</p>
              <h2 id="title">페이지를 찾을 수 없습니다</h2>
              <p class="description">
                입력한 주소가 올바르지 않거나 페이지가 이동되었습니다.
                아래에서 필요한 화면으로 이동해 주세요.
              </p>
              <div class="actions">
                <a class="button primary" href="/">시간표 조회</a>
                <a class="button secondary" href="javascript:history.back()">이전 화면</a>
              </div>
            </div>
          </article>

          <nav class="quick-links" aria-label="빠른 이동">
            <a class="quick-link" href="/slide">
              <strong>슬라이드쇼</strong>
              <span>전자칠판용 자동 화면</span>
            </a>
            <a class="quick-link" href="/download">
              <strong>다운로드</strong>
              <span>Windows 위젯, Android APK</span>
            </a>
            <a class="quick-link" href="/admin">
              <strong>관리자</strong>
              <span>시간표와 안내사항 관리</span>
            </a>
            <a class="quick-link" href="/widget/widget.html">
              <strong>위젯 화면</strong>
              <span>브라우저에서 위젯 확인</span>
            </a>
          </nav>

          <div class="footer-note">용정중학교 전자시간표 서비스</div>
        </section>
      </main>
    </div>
  </body>
</html>
