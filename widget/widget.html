<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>용정시간표 - Widget</title>
    <link rel="stylesheet" href="./widget.css" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TTWC1RKWGL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());

      gtag("config", "G-TTWC1RKWGL");
    </script>
  </head>
  <body>
    <div class="widget">
      <header class="widget-head">
        <div class="drag-region">
          <img src="../assets/logo.png" alt="" />
          <div>
            <p id="dateLabel">오늘 시간표</p>
            <h1>용정 시간표</h1>
          </div>
        </div>
        <div class="controls">
          <label class="toggle">
            <input id="themeToggle" type="checkbox" />
            <span>라이트</span>
          </label>
          <label class="toggle">
            <input id="pinToggle" type="checkbox" />
            <span>위에 고정</span>
          </label>
          <label class="toggle">
            <input id="startupToggle" type="checkbox" />
            <span>부팅 실행</span>
          </label>
          <label class="opacity-control" for="opacityRange">
            <span>투명도</span>
            <input id="opacityRange" type="range" min="55" max="100" step="5" />
          </label>
          <label class="font-control" for="fontScaleRange">
            <span id="fontScaleLabel">글씨 100%</span>
            <input id="fontScaleRange" type="range" min="80" max="150" step="5" />
          </label>
          <div class="subject-control">
            <span>내 과목 설정</span>
            <button id="subjectFilterButton" class="subject-filter-button" type="button">전체</button>
          </div>
          <button id="refreshButton" type="button">새로고침</button>
          <button id="closeButton" class="icon-button" type="button" aria-label="닫기">×</button>
        </div>
      </header>

      <main>
        <div id="status" class="status">시간표를 불러오는 중입니다.</div>
        <div id="schedule" class="week-shell"></div>
      </main>
    </div>
    <div id="subjectFilterOverlay" class="subject-filter-overlay" hidden>
      <section class="subject-filter-dialog" role="dialog" aria-modal="true" aria-labelledby="subjectFilterTitle">
        <div class="subject-filter-dialog-head">
          <div>
            <strong id="subjectFilterTitle">내 과목 설정</strong>
            <span>과목과 표시 학년을 선택하세요.</span>
          </div>
          <button id="subjectFilterClose" class="icon-button" type="button" aria-label="닫기">×</button>
        </div>
        <div id="subjectFilterMenu" class="subject-filter-menu"></div>
      </section>
    </div>

    <script src="../src/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../src/storage.js"></script>
    <script src="./widget.js"></script>
  </body>
</html>
